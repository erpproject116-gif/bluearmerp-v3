name: E2E demo smoke (API + web)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "api/**"
      - "scripts/mint-bench-jwt.mjs"
      - "scripts/seed-ci-bench-auth.sql"
      - "scripts/seed-demo-*.sql"
      - "supabase/seed.sql"
      - ".github/workflows/e2e-demo-smoke.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - "api/**"
      - "scripts/mint-bench-jwt.mjs"
      - "scripts/seed-ci-bench-auth.sql"
      - "scripts/seed-demo-*.sql"
      - "supabase/seed.sql"
      - ".github/workflows/e2e-demo-smoke.yml"

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    # Without a cap a stuck Playwright step burns hours before anyone notices.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:15
          sleep 5

      - name: Apply migrations and demo seed
        run: |
          sudo apt-get install -y postgresql-client
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
          for f in api/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
          # Align with production: record schema_migrations via migrate CLI
          (cd api && go run ./cmd/migrate)
          psql "$DATABASE_URL" -f supabase/seed.sql
          psql "$DATABASE_URL" -f scripts/seed-demo-inventory.sql
          psql "$DATABASE_URL" -f scripts/seed-ci-bench-auth.sql
          psql "$DATABASE_URL" -f scripts/seed-demo-purchase-requests.sql
          psql "$DATABASE_URL" -f scripts/seed-demo-po-gr-open.sql
          psql "$DATABASE_URL" -f scripts/seed-demo-quotations.sql || true
          psql "$DATABASE_URL" -f scripts/seed-demo-sales-orders.sql || true
          psql "$DATABASE_URL" -f scripts/seed-demo-sales.sql || true
          psql "$DATABASE_URL" -f scripts/seed-demo-finance-ap.sql || true

      - name: Build and start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
          CORS_ORIGIN: http://localhost:4173
          PORT: "8080"
          MIGRATIONS_DIR: api/migrations
        run: |
          cd api
          go build -o /tmp/server ./cmd/server
          /tmp/server &
          sleep 3

      - name: Wait for API schema health
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf http://127.0.0.1:8080/health/schema || true)
            echo "$body" | grep -q '"healthy":true' && exit 0
            sleep 2
          done
          echo "API schema health check failed"; curl -s http://127.0.0.1:8080/health/schema || true; exit 1

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build coverage manifest
        working-directory: web
        run: |
          npm run e2e:routes:extract
          npm run e2e:coverage:manifest

      - name: Install Playwright
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Build web for preview
        working-directory: web
        env:
          VITE_API_BASE_URL: http://localhost:8080
          VITE_SUPABASE_URL: http://127.0.0.1
          VITE_SUPABASE_ANON_KEY: ci-anon-key-not-used-for-bench-jwt
        run: npm run build

      - name: Start preview server
        working-directory: web
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 2
          done
          echo "Preview server did not start" && exit 1

      - name: Playwright demo smoke
        working-directory: web
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:4173
          SUPABASE_JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
          E2E_TIER: posting
          E2E_ALLOW_MUTATIONS: "1"
          E2E_RUN_CONFIRM: ci-${{ github.run_id }}
        run: |
          export E2E_BENCH_TOKEN=$(node ../scripts/mint-bench-jwt.mjs)
          npx playwright test --project=chromium \
            e2e/coverage-manifest.spec.ts \
            e2e/route-smoke.spec.ts \
            e2e/core-interactions.spec.ts \
            e2e/sales-invoice.spec.ts \
            e2e/goods-receipt-receive.spec.ts \
            e2e/quotation-crud.spec.ts \
            e2e/sales-order-crud.spec.ts \
            e2e/sale-crud.spec.ts \
            e2e/purchase-order-crud.spec.ts \
            e2e/purchase-crud.spec.ts \
            e2e/official-receipt-crud.spec.ts \
            e2e/inventory-partners-items.spec.ts \
            e2e/page-grid-form-contracts.spec.ts \
            e2e/business-chains.spec.ts
