name: API perf smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "api/**"
      - "scripts/bench-api.mjs"
      - "scripts/perf/**"
      - ".github/workflows/api-perf-smoke.yml"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Start Postgres
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 postgres:15
          sleep 5

      - name: Apply migrations
        run: |
          sudo apt-get install -y postgresql-client
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres
          for f in api/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
          psql "$DATABASE_URL" -f supabase/seed.sql
          psql "$DATABASE_URL" -f scripts/seed-demo-inventory.sql

      - name: Start API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE_JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
          CORS_ORIGIN: http://localhost:5173
          PORT: "8080"
        run: |
          cd api
          go build -o /tmp/server ./cmd/server
          /tmp/server &
          sleep 2

      - name: Bench (unauthenticated smoke)
        run: node scripts/bench-api.mjs
        env:
          API_BASE: http://localhost:8080
          BENCH_ITERATIONS: "5"
          BENCH_P95_MAX_MS: "2000"
