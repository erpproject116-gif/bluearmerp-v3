name: E2E smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/e2e-smoke.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Vitest unit + link integrity
        working-directory: web
        run: |
          npm run e2e:routes:extract
          npm run e2e:coverage:manifest
          npm test

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Playwright
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Sign-in page smoke
        working-directory: web
        run: npx playwright test e2e/smoke.spec.ts e2e/coverage-manifest.spec.ts --project=chromium -g "@smoke"
        env:
          CI: "true"
