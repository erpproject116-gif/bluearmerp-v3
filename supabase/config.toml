# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "bluearm-erp-v3"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = ["../api/migrations/*.sql"]

[db.seed]
enabled = true
sql_paths = [
  "./seed.sql",
  "../scripts/seed-platform-owners.sql",
  "../scripts/seed-demo-inventory.sql",
  "../scripts/seed-demo-quotations.sql",
  "../scripts/seed-demo-purchase-requests.sql",
  "../scripts/seed-demo-sales-orders.sql",
  "../scripts/seed-demo-golden-scenarios.sql",
  "../scripts/seed-demo-po-gr-open.sql",
  "../scripts/seed-demo-sales.sql",
  "../scripts/seed-demo-finance.sql",
  "../scripts/seed-demo-finance-ap.sql",
  "../scripts/seed-demo-crm.sql",
  "../scripts/seed-demo-dashboard.sql",
  "../scripts/verify-demo-full-chain.sql",
]

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = false
# Enable in Dashboard for hosted; set client_id and secret locally when ready.
