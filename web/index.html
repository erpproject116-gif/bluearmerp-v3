<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3c50e0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bluearm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Bluearm ERP for purchasing, sales, inventory, and accounting."
    />
    <title>BluearmERP</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
        transition: opacity 0.2s ease;
      }
      #boot-splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash img {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <div style="display:flex;max-width:22rem;flex-direction:column;align-items:center;padding:0 1.5rem;text-align:center">
        <img src="/favicon.png" alt="" width="72" height="72" fetchpriority="high" decoding="sync" />
        <h1 style="margin:16px 0 0;font-size:40px;line-height:1.15;font-weight:600;color:#1c2434">Sign in to Bluearm ERP</h1>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
